name: ci

on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck -w @ai-playground/mobile-sdk
      - run: npm run typecheck -w @ai-playground/mobile
      - run: npm run typecheck -w @ai-playground/api

      - run: npm run test:mobile-smoke -w @ai-playground/api
